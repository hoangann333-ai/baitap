<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu dọc ACCP i10</title>
    <style>
        body {
            margin: 40px;
            font-family: Arial, sans-serif;
        }

        h3 {
            margin: 0 0 28px;
            font-size: 28px;
        }

        #menu,
        #menu ul,
        #menu li {
            margin: 0;
            padding: 0;
        }

        #menu ul {
            list-style: none;
        }

        #menu li {
            position: relative;
            box-sizing: border-box;
            width: 216px;
            height: 46px;
            background-color: #000;
            line-height: 46px;
            cursor: pointer;
        }

        #menu li > a {
            display: block;
            padding: 0 30px;
            color: #fff;
            font-size: 22px;
            text-decoration: none;
            white-space: nowrap;
        }

        #menu li:hover,
        #menu li:focus-within {
            background-color: #e00000;
        }

        /* Menu con mở bên phải mục cha. */
        #menu ul ul {
            position: absolute;
            top: 0;
            left: 100%;
            z-index: 10;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        #menu ul li:hover > ul,
        #menu ul li:focus-within > ul {
            visibility: visible;
            opacity: 1;
        }

        @media (max-width: 520px) {
            body { margin: 24px; }
            #menu li { width: 190px; }
        }
    </style>
</head>
<body>
    <h3>ACCP i10</h3>

    <nav id="menu" aria-label="Danh sách học kỳ">
        <ul>
            <li>
                <a href="#sem1">Sem 1</a>
                <ul>
                    <li><a href="#computing">Computing Fundamental</a></li>
                    <li><a href="#c-programming">C Programming</a></li>
                    <li><a href="#dynamic-website">Building Dynamic Website</a></li>
                    <li><a href="#transact-sql">MS Transact-SQL</a></li>
                    <li><a href="#project">Project</a></li>
                </ul>
            </li>
            <li>
                <a href="#sem2">Sem 2</a>
                <ul>
                    <li><a href="#cloud">Cloud Computing</a></li>
                    <li><a href="#apj1">APJ - I</a></li>
                    <li><a href="#apj2">APJ - II</a></li>
                    <li><a href="#apj3">APJ - III</a></li>
                    <li><a href="#eproject">eProject</a></li>
                </ul>
            </li>
            <li><a href="#sem3">Sem 3</a></li>
            <li><a href="#sem4">Sem 4</a></li>
        </ul>
    </nav>
</body>
</html>
